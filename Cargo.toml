[package]
name = "ocy"
version = "0.2.0"
authors = ["Alexandre Delattre <alexandre.delattre.biz@gmail.com>"]
edition = "2024"
description = "ocy is a simple project cleaner CLI"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    "ocy-core"
]

[dependencies]
eyre = "0.6"
glob = "0.3"
colored = "3"
ocy-core = { path = "./ocy-core", version = "0.2" }
indicatif = "0.18"
gumdrop = "0.8"

[profile.release]
lto = true
codegen-units = 1
